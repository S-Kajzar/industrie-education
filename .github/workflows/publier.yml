# Publication du site sur GitHub Pages (lot 1e).
# À chaque envoi sur main :
#   1. import des fichiers déposés (« Dépôt rapide » de /admin/, ou medias/import/ sur GitHub) et des nouvelles
#      versions validées : outils/importer.py, un seul commit poussé sur main ;
#   2. contrôle 20/20 des annales, puis construction : outils/chaine.js. Une erreur de contenu retient seulement sa
#      fiche ; le résumé de publication (récapitulatif de l'exécution) commence par « À corriger » ;
#   3. tests ; s'ils passent, mise en ligne. Une erreur de code (construction ou test) arrête tout : le site en ligne
#      ne change pas.
# Prérequis (une fois) : Settings → Pages → Build and deployment → Source : « GitHub Actions ».
name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:

# L'import écrit dans le dépôt (fiches créées, fichiers rangés) : permission d'écriture sur le contenu, et rien
# d'autre. Les commits faits avec ce jeton ne relancent pas l'Action : l'import est publié dans la même exécution.
permissions:
  contents: write

# File d'attente : une seule publication à la fois, aucune n'est interrompue. Si plusieurs envois arrivent pendant
# une publication, seul le dernier attend son tour (GitHub annule les intermédiaires) ; comme chaque exécution
# travaille sur la dernière version de main, rien n'est perdu.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    name: Construire et tester
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt (dernière version de main)
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Installer Jinja2 et Pillow
        run: pip install -r requirements.txt

      - name: Reprendre les images déjà traitées (cache hors dépôt)
        uses: actions/cache@v4
        with:
          path: .cache/images
          key: images-${{ hashFiles('medias/cartes/**', 'medias/illustrations/**', 'outils/illustrations.py') }}
          restore-keys: images-

      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Installer Playwright, les polices et le back-office (Sveltia CMS)
        run: npm ci

      - name: Installer Chromium (contrôle 20/20 et tests)
        run: npx playwright install --with-deps chromium

      # Fiches créées en brouillon pour les fichiers déposés, nouvelles versions validées : un seul commit.
      - name: Importer les fichiers déposés
        run: python3 outils/importer.py --commit --rapport .cache/import.md

      # Liste des pages en ligne : une fiche retenue qui y figure est signalée « retirée du site ».
      - name: Lire l'état de la version en ligne
        run: |
          adresse=$(python3 -c "import json; s = json.load(open('site.json')); print(s['origine'] + s['base'] + 'admin/etat.json')")
          curl -fsSL "$adresse" -o .cache/etat-en-ligne.json || echo "Pas d'état en ligne (première publication du lot 1e)."

      # Résumé de publication de Sébastien : « À corriger » d'abord, puis images à régulariser, import, tableau de
      # bord éditorial. Des titres, des chemins et des comptes ; aucun secret.
      - name: Contrôle 20/20, construction et résumé de publication
        run: node outils/chaine.js --resume "$GITHUB_STEP_SUMMARY" --precedent .cache/etat-en-ligne.json --import .cache/import.md

      - name: Tester le site construit
        run: npx playwright test

      - name: Préparer _site/ pour GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  publier:
    name: Mettre en ligne
    needs: construire
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deploiement
        uses: actions/deploy-pages@v4
