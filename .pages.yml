# Back-office du site : configuration de Pages CMS (https://pagescms.org, licence MIT), TRAME § 9.
# Mode d'emploi pour Sébastien : GUIDE-BACK-OFFICE.md.
#
# Chaque enregistrement fait un commit sur main ; l'Action « Publier le site » construit, teste et publie (environ
# 2 minutes). Les listes fermées (types, niveaux, thèmes, filières, licences, statuts) recopient les données de
# catalogue/ et d'outils/ : le test tests/back-office.spec.js vérifie qu'elles restent synchronisées.
# Rubriques rangées par fréquence d'usage : Annales, Contenus, Images et crédits, Accueil, Notions, Thèmes, Réglages.
#
# Notions : Pages CMS 2.1 ne sait pas lire les options d'une liste dans un fichier (les listes « select » sont
# écrites ici, les « références » ne visent que des rubriques de type collection). Les notions se saisissent donc
# librement dans les fiches ; la construction refuse un identifiant absent de catalogue/notions.json.
#
# Organisation des fichiers choisie pour le back-office (justifiée dans NOTE-DE-LIVRAISON.md) :
#   - annales : une fiche à plat annales/<id>.json, le fichier HTML dans medias/depots/ ;
#   - contenus : une sous-rubrique par collection ; les fiches existantes (dossier <id>/contenu.json) se modifient,
#     les nouveaux contenus autonomes sont créés à plat (<id>.json), le fichier HTML dans medias/depots/.
# Une collection ajoutée dans contenus/ doit recevoir sa sous-rubrique ci-dessous (le test le rappelle).

media:
  - name: cartes
    label: Images de cartes
    input: medias/cartes
    output: medias/cartes
    extensions: [jpg, jpeg, png, webp]
    rename: safe
  - name: illustrations
    label: Planches d'illustration
    input: medias/illustrations
    output: medias/illustrations
    extensions: [jpg, jpeg, png, webp]
    rename: safe
  - name: depots
    label: Fichiers HTML déposés
    input: medias/depots
    output: medias/depots
    extensions: [html]
    rename: safe

settings:
  content:
    # Indispensable : à l'enregistrement d'une fiche, les champs non affichés ici (mode, source…) sont conservés.
    merge: true
  commit:
    templates:
      create: "Back-office : création de {path}"
      update: "Back-office : modification de {path}"
      delete: "Back-office : suppression de {path}"
      rename: "Back-office : {oldPath} renommé en {newPath}"

components:
  identifiant:
    label: Identifiant
    type: string
    required: true
    pattern:
      regex: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
      message: "Minuscules sans accent, chiffres et tirets seulement (ex. : levage-dechargement-sacs-linge)."
  image-carte:
    label: Image de la carte (facultative)
    description: "Sans image, la carte garde son bandeau typographique. L'image doit être déclarée dans la rubrique Crédits, avec sa licence, sinon la publication s'arrête."
    type: object
    fields:
      - name: fichier
        label: Image (JPEG, PNG ou WebP)
        type: image
        options:
          media: cartes
      - name: alt
        label: Texte alternatif
        description: "Une phrase qui décrit l'image pour qui ne la voit pas (ex. : « Cadre de VTT et ses liaisons »). Obligatoire, sauf image déclarée décorative dans les Crédits."
        type: string
  notions:
    label: Notions
    description: "Identifiants de la rubrique Notions (ex. : statique, pfs, roulements), un par ligne : ils relient une annale aux cours et exercices des mêmes notions. Un identifiant absent de la rubrique Notions arrête la publication ; le message propose les identifiants proches."
    type: string
    list:
      collapsible: false
    pattern:
      regex: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
      message: "Minuscules sans accent, chiffres et tirets seulement (ex. : cinematique-graphique)."
  statut:
    label: Statut
    description: "Brouillon : invisible sur le site (mais lisible sur GitHub, le dépôt est public). Relu : publié. Ne passer en « relu » qu'après avoir vérifié les réponses attendues."
    type: select
    required: true
    options:
      values:
        - value: brouillon
          label: Brouillon (non publié)
        - value: relu
          label: Relu (publié)
  theme:
    label: Thème
    type: select
    required: true
    options:
      values:
        - value: mecanique
          label: Mécanique et conception
        - value: energie
          label: Énergie
        - value: numerique
          label: Information et numérique
        - value: systemes
          label: Analyse des systèmes
        - value: habitat
          label: Habitat et construction
  publics:
    label: Filières
    type: select
    options:
      multiple: true
      values:
        - value: si
          label: SI
        - value: sti2d
          label: STI2D
        - value: bac-pro-mspc
          label: Bac Pro MSPC
        - value: bts-ms
          label: BTS MS
  planche:
    label: Planche d'illustration
    description: "Planche technique ancienne du domaine public ou sous CC0, déclarée dans la rubrique Crédits. Elle est passée en niveaux de gris sur fond blanc à la publication."
    type: object
    fields:
      - name: fichier
        label: Planche (JPEG, PNG ou WebP)
        type: image
        options:
          media: illustrations
      - name: alt
        label: Texte alternatif
        description: "Laisser vide seulement si la planche est déclarée décorative dans les Crédits."
        type: string

content:
  # --------------------------------------------------------------------------------------------------------------
  - name: annales
    label: Annales
    description: "Le plus fréquent : déposer une annale du projet Claude (fichier HTML + fiche). Publiée sur /annales/<identifiant>/ seulement au statut « Relu », avec sa source."
    type: collection
    path: annales
    format: json
    filename: "{fields.id}.json"
    subfolders: false
    view:
      fields: [titre, statut, mis_a_jour]
      primary: titre
      sort: [mis_a_jour, titre]
      default:
        sort: mis_a_jour
        order: desc
    fields:
      - name: id
        component: identifiant
        label: Identifiant (adresse de la page)
        description: "Devient l'adresse /annales/<identifiant>/. Nom neutre, sans diplôme ni session. Ne plus le changer une fois publié."
      - name: titre
        label: Titre
        type: string
        required: true
      - name: presentation
        label: Présentation
        description: "Deux ou trois phrases (300 caractères au plus) : le système étudié, les parties, la durée. Elles servent de description pour les moteurs de recherche et sur la carte ; la page montre celles du fichier, juste sous la fiche."
        type: text
        required: true
      - name: fichier
        label: Fichier HTML du sujet
        description: "Le fichier autonome livré par le projet Claude (un seul fichier .html, images intégrées, 3 Mo au plus pour l'envoi par le back-office). Il est publié tel quel, jamais modifié."
        type: file
        required: true
        options:
          media: depots
      - name: image
        component: image-carte
      - name: publics
        component: publics
        required: true
      - name: theme
        component: theme
      - name: notions
        component: notions
      - name: duree_min
        label: Durée conseillée (en minutes)
        type: number
        options:
          min: 1
      - name: origine
        label: Origine du sujet (classement interne)
        description: "Diplôme, épreuve et session d'origine. Rien n'est affiché sur le site tant que « Afficher l'origine » n'est pas coché."
        type: object
        fields:
          - name: diplome
            label: Diplôme
            type: string
          - name: epreuve
            label: Épreuve
            type: string
          - name: session
            label: Session (année)
            type: number
            options:
              min: 1950
              max: 2100
      - name: source
        label: Source et licence du sujet (obligatoire pour publier)
        description: "Affichée dans la fiche de l'annale par une ligne de crédit, quel que soit « Afficher l'origine », et sur la page Crédits. Sans source valide, une annale « Relu » arrête la publication."
        type: object
        fields:
          - name: editeur
            label: Éditeur
            description: "Ex. : éduscol STI (sujets d'examen sur sti.eduscol.education.fr), éduscol (annales du bac sur eduscol.education.gouv.fr). Il devient le lien de la ligne de crédit."
            type: string
          - name: url
            label: Adresse du document d'origine
            description: "Adresse complète en https://, celle du fichier téléchargé (sujet ou dossier questionnaire). Obligatoire pour les licences CC BY-NC-SA et Licence Ouverte."
            type: string
            pattern:
              regex: '^$|^https://[^\s/]+\.[^\s/]+(/\S*)?$'
              message: "Une adresse complète qui commence par https://, ou rien."
          - name: licence
            label: Licence
            description: "CC BY-NC-SA 2.0 FR : sujets d'éduscol STI. Licence Ouverte 2.0 : annales du bac sur eduscol.education.gouv.fr. Autorisation écrite : à référencer ci-dessous. Œuvre personnelle : sujet écrit par vous."
            type: select
            options:
              values:
                - value: cc-by-nc-sa-2.0-fr
                  label: CC BY-NC-SA 2.0 FR (éduscol STI)
                - value: etalab-2.0
                  label: Licence Ouverte 2.0 (éduscol, annales du bac)
                - value: autorisation-ecrite
                  label: Autorisation écrite
                - value: oeuvre-personnelle
                  label: Œuvre personnelle
          - name: reference_autorisation
            label: Référence de l'autorisation
            description: "Obligatoire pour une autorisation écrite : qui, quand, par quel écrit (ex. : courriel de la société X du 12/03/2027)."
            type: string
      - name: afficher_origine
        label: Afficher l'origine sur le site
        description: "Décoché (par défaut) : le diplôme, l'épreuve et la session n'apparaissent nulle part sur le site. Coché : ils apparaissent dans la fiche, le titre de la page et l'index des annales. Le fichier HTML reste neutre dans les deux cas. La ligne de crédit (source) est affichée dans les deux cas."
        type: boolean
        default: false
      - name: statut
        component: statut
        default: brouillon
      - name: mis_a_jour
        label: Mis à jour le
        description: "Les trois annales les plus récentes s'affichent sur l'accueil."
        type: date
        options:
          format: yyyy-MM-dd

  # --------------------------------------------------------------------------------------------------------------
  - name: contenus
    label: Contenus
    description: "Une sous-rubrique par collection : modifier une fiche (titre, description, notions, image de carte…) ou créer un nouveau contenu autonome (fiche + fichier HTML)."
    type: group
    items:
      - name: contenus-statique
        label: Statique
        type: collection
        path: contenus/statique
        format: json
        filename: "{fields.id}.json"
        exclude: [collection.json]
        view: &vue-contenus
          layout: tree
          node: contenu.json
          fields: [titre, type, statut]
          primary: titre
        fields: &champs-contenu
          - name: id
            component: identifiant
            label: Identifiant (adresse de la page)
            description: "Devient l'adresse /<collection>/<identifiant>/. Ne plus le changer une fois publié."
          - name: titre
            label: Titre
            type: string
            required: true
          - name: type
            label: Type
            type: select
            required: true
            options:
              values:
                - value: cours
                  label: Cours
                - value: exercice
                  label: Exercice
                - value: activite
                  label: Activité
                - value: etude
                  label: Étude de cas
                - value: qcm
                  label: QCM
                - value: formulaire
                  label: Formulaire
          - name: niveau
            label: Niveau
            description: "Laisser vide pour un formulaire."
            type: select
            options:
              values:
                - value: "1"
                  label: Niveau 1
                - value: "2"
                  label: Niveau 2
                - value: "3"
                  label: Niveau 3
          - name: duree_min
            label: Durée conseillée (en minutes)
            type: number
            options:
              min: 1
          - name: description
            label: Description
            description: "Une ou deux phrases : ce que l'élève fait, sur quel système. Elle s'affiche sur la carte et sert de description pour les moteurs de recherche."
            type: text
            required: true
          - name: mots_cles
            label: Mots-clés (recherche du catalogue)
            type: string
            list:
              collapsible: false
          - name: notions
            component: notions
          - name: image
            component: image-carte
          - name: fichier
            label: Fichier HTML (nouveau contenu seulement)
            description: "Pour un nouveau contenu : le fichier autonome livré par le projet Claude (un seul fichier .html, 5 Mo au plus). Laisser vide pour un contenu existant."
            type: file
            options:
              media: depots
          - name: statut
            component: statut
      - name: contenus-demo-binaire
        label: Binaire (démonstration)
        type: collection
        path: contenus/demo-binaire
        format: json
        filename: "{fields.id}.json"
        exclude: [collection.json]
        view: *vue-contenus
        fields: *champs-contenu
      - name: contenus-demo-leviers
        label: Leviers (démonstration)
        type: collection
        path: contenus/demo-leviers
        format: json
        filename: "{fields.id}.json"
        exclude: [collection.json]
        view: *vue-contenus
        fields: *champs-contenu
      - name: contenus-demo-rendement
        label: Rendement (démonstration)
        type: collection
        path: contenus/demo-rendement
        format: json
        filename: "{fields.id}.json"
        exclude: [collection.json]
        view: *vue-contenus
        fields: *champs-contenu

  # --------------------------------------------------------------------------------------------------------------
  - name: credits
    label: Images et crédits
    description: "Une entrée par image téléversée (carte ou planche) : chemin, auteur, source, licence. Sans entrée ici, la publication s'arrête. Jamais d'image générée par IA, ni de banque d'images."
    type: file
    path: medias/CREDITS.json
    format: json
    list: true
    fields:
      - name: fichier
        label: Chemin de l'image
        description: "Tel qu'il apparaît dans la fiche, ex. : medias/cartes/levage-linge.jpg ou medias/illustrations/encyclopedie-forge.png."
        type: string
        required: true
        pattern:
          regex: '^medias/(cartes|illustrations)/[^/]+\.(jpg|jpeg|png|webp)$'
          message: "Un chemin de la forme medias/cartes/nom.jpg ou medias/illustrations/nom.png."
      - name: titre
        label: Titre de l'œuvre
        type: string
        required: true
      - name: auteur
        label: Auteur
        type: string
      - name: date
        label: Date (année ou siècle)
        type: string
      - name: source
        label: Source (adresse de la page d'origine)
        type: string
      - name: licence
        label: Licence
        description: "Domaine public : œuvre ancienne libre de droits (Encyclopédie, brevets américains anciens…). CC0 : dédiée au domaine public par son auteur (musées en accès ouvert). Œuvre personnelle : photo ou dessin de Sébastien. Autorisation écrite : accord écrit du propriétaire (constructeur…), à référencer ci-dessous."
        type: select
        required: true
        options:
          values:
            - value: domaine-public
              label: Domaine public
            - value: cc0
              label: CC0
            - value: oeuvre-personnelle
              label: Œuvre personnelle
            - value: autorisation-ecrite
              label: Autorisation écrite
      - name: reference_autorisation
        label: Référence de l'autorisation
        description: "Obligatoire pour une autorisation écrite : qui, quand, par quel écrit (ex. : courriel de la société X du 12/03/2027)."
        type: string
      - name: usage
        label: Usage sur le site
        description: "Ex. : carte de l'annale « Levage du linge », planche de l'accueil."
        type: string
      - name: decorative
        label: Image décorative (texte alternatif vide)
        description: "À cocher seulement si l'image n'apporte aucune information (ex. : planche derrière le titre)."
        type: boolean
        default: false

  # --------------------------------------------------------------------------------------------------------------
  - name: accueil
    label: Accueil
    description: "Contenus à la une, titres et planche de l'accueil, textes des pages Labo et Maquettes."
    type: group
    items:
      - name: a-la-une
        label: Contenus à la une
        description: "De 3 à 6 contenus publiés, dans l'ordre d'affichage."
        type: file
        path: catalogue/a-la-une.json
        format: json
        fields:
          - name: contenus
            label: Identifiants des contenus à la une
            description: "Identifiant d'un contenu publié (ex. : cadre-velo), un par ligne."
            type: string
            list:
              min: 3
              max: 6
              collapsible: false
            pattern:
              regex: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
              message: "Minuscules sans accent, chiffres et tirets seulement."
      - name: titres-accueil
        label: Titres et planche de l'accueil
        type: file
        path: site.json
        format: json
        fields:
          - name: titres_accueil
            label: Titre d'accueil selon le moment
            description: "Un retour à la ligne dans le champ = un retour à la ligne à l'écran."
            type: object
            fields:
              - name: cours
                label: En semaine, 8 h – 12 h et 14 h – 17 h (titre par défaut)
                type: text
                required: true
              - name: matin
                label: En semaine, 6 h – 8 h
                type: text
                required: true
              - name: midi
                label: En semaine, 12 h – 14 h
                type: text
                required: true
              - name: soir
                label: En semaine, 17 h – 22 h
                type: text
                required: true
              - name: nuit
                label: En semaine, 22 h – 6 h
                type: text
                required: true
              - name: week-end
                label: Samedi et dimanche
                type: text
                required: true
          - name: illustration_accueil
            component: planche
            label: Planche de l'accueil, derrière le titre
      - name: a-venir
        label: Labo et Maquettes (à venir)
        description: "Textes du bloc « Bientôt » de l'accueil et des pages /labo/ et /maquettes/. Une phrase de promesse, sans date."
        type: file
        path: catalogue/a-venir.json
        format: json
        fields:
          - name: labo
            label: Labo
            type: object
            fields: &champs-a-venir
              - name: titre
                label: Titre
                type: string
                required: true
              - name: promesse
                label: Promesse (une phrase, sans date)
                type: text
                required: true
              - name: illustration
                component: planche
          - name: maquettes
            label: Maquettes
            type: object
            fields: *champs-a-venir

  # --------------------------------------------------------------------------------------------------------------
  - name: notions
    label: Notions
    description: "Ajouter une notion ou renommer son libellé. L'identifiant d'une notion déjà utilisée ne se change pas."
    type: file
    path: catalogue/notions.json
    format: json
    list: true
    fields:
      - name: id
        component: identifiant
        label: Identifiant
        description: "Minuscules sans accent et tirets (ex. : cinematique-graphique). C'est lui qu'on écrit dans les fiches."
      - name: nom
        label: Libellé affiché
        description: "Avec ses accents (ex. : Cinématique graphique)."
        type: string
        required: true

  # --------------------------------------------------------------------------------------------------------------
  - name: themes
    label: Thèmes
    description: "Les cinq thèmes : nom, exemples, planche. Leur identifiant et leur adresse ne changent pas ; un thème sans contenu publié s'affiche « Bientôt »."
    type: file
    path: catalogue/themes.json
    format: json
    list:
      min: 5
      max: 5
      collapsible: true
    fields:
      - name: id
        label: Identifiant
        type: string
        readonly: true
      - name: nom
        label: Nom
        type: string
        required: true
      - name: court
        label: Nom court (bandeau des cartes)
        type: string
        required: true
      - name: exemples
        label: Exemples (index de l'accueil)
        type: string
        list:
          collapsible: false
      - name: illustration
        component: planche

  # --------------------------------------------------------------------------------------------------------------
  - name: reglages
    label: Réglages du site
    description: "Mentions légales (éditeur, contact), mesure d'audience Umami, ouverture aux moteurs de recherche."
    type: file
    path: site.json
    format: json
    fields:
      - name: editeur
        label: Éditeur (mentions légales)
        type: object
        fields:
          - name: nom
            label: Nom de l'éditeur
            type: string
          - name: adresse
            label: Adresse
            type: string
          - name: directeur_publication
            label: Directeur de la publication
            type: string
      - name: contact
        label: Adresse de contact
        description: "Utilisée par « Signaler une erreur » et « Devenir partenaire »."
        type: string
        pattern:
          regex: '^$|^[^@\s]+@[^@\s]+\.[^@\s]+$'
          message: "Une adresse électronique, ou rien."
      - name: umami
        label: Identifiant Umami (mesure d'audience)
        description: "Vide : aucune mesure d'audience. Renseigné : le script Umami (sans cookie) est ajouté à chaque page."
        type: string
        pattern:
          regex: '^$|^[0-9a-fA-F-]{8,}$'
          message: "L'identifiant du site donné par Umami (lettres a-f, chiffres et tirets)."
      - name: umami_script
        label: Adresse du script Umami
        description: "Celle du code de suivi donné par Umami (attribut src), elle dépend de la région choisie à la création du compte. Par défaut : https://cloud.umami.is/script.js."
        type: string
        pattern:
          regex: '^https://[A-Za-z0-9.-]+\.[A-Za-z]{2,}(:[0-9]+)?/\S*$'
          message: "Une adresse complète qui commence par https:// (ex. : https://cloud.umami.is/script.js)."
      - name: indexable
        label: Ouvert aux moteurs de recherche
        description: "Décoché tant que le site est en préproduction. À cocher seulement à la bascule sur le domaine industrie.education. Refusé tant que le nom de l'éditeur, le directeur de la publication ou l'adresse de contact sont vides."
        type: boolean
